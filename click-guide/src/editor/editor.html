<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClickGuide 편집기</title>
  <link rel="stylesheet" href="../common/ui.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark"></span><strong>ClickGuide</strong></div>
  <select id="session-select" title="가이드 선택"></select>
  <span class="spacer"></span>
  <button id="btn-undo" class="sm ghost" title="되돌리기 (Ctrl+Z)" disabled>되돌리기</button>
  <button id="btn-redo" class="sm ghost" title="다시 하기 (Ctrl+Shift+Z)" disabled>다시 하기</button>
  <button id="btn-ai" class="sm" title="LLM으로 단계 문장을 다듬습니다">AI로 문장 다듬기</button>
  <div class="menu">
    <button id="btn-export" class="primary sm">내보내기 ▾</button>
    <div id="export-menu" class="dropdown" hidden>
      <button data-export="docx">Word 문서 (.docx)</button>
      <button data-export="pptx">PowerPoint (.pptx)</button>
      <button data-export="html">HTML 파일 (이미지 포함)</button>
      <button data-export="pdf">PDF로 인쇄</button>
      <button data-export="md">Markdown + 이미지 ZIP</button>
      <button data-export="json">JSON (원본 데이터)</button>
      <label class="export-size">이미지 크기
        <select id="export-width" title="내보낼 때 스크린샷 가로 크기. 줄이면 파일이 작아집니다">
          <option value="0">원래 크기</option>
          <option value="1280">가로 1280px</option>
          <option value="960">가로 960px</option>
        </select>
      </label>
    </div>
  </div>
  <button id="btn-options" class="ghost sm" title="설정">설정</button>
  <button id="btn-delete" class="ghost sm danger" title="이 가이드 삭제">삭제</button>
</header>

<main>
  <div id="empty" class="empty card" hidden>
    <h2>아직 가이드가 없습니다</h2>
    <p class="muted">확장 아이콘을 눌러 <strong>녹화 시작</strong>을 누르면, 그때부터의 클릭과 입력이 단계로 기록됩니다.</p>
    <p class="muted">다른 PC·다른 폴더에서 쓰던 가이드는 그쪽에서 받은 전체 백업을 <strong>설정 → 데이터 → 백업에서 가져오기</strong>로 옮길 수 있습니다.</p>
  </div>

  <section id="doc" hidden>
    <div class="doc-head card">
      <input id="guide-title" placeholder="가이드 제목" aria-label="가이드 제목">
      <textarea id="guide-desc" placeholder="이 가이드는 무엇을 하는 방법인가요? (선택)" aria-label="가이드 설명"></textarea>
      <p id="stats" class="faint"></p>
      <details id="rev-box" class="rev-box">
        <summary>개정 이력 <span class="faint">Word 문서 앞쪽 표에 들어갑니다</span></summary>
        <table class="rev-table">
          <thead><tr><th>버전</th><th>날짜</th><th>작성자</th><th>내용</th><th></th></tr></thead>
          <tbody id="rev-rows"></tbody>
        </table>
        <div class="row">
          <button id="rev-add" class="sm">줄 추가</button>
          <span class="faint" id="rev-hint">비워 두면 "1.0 · 만든 날 · 설정의 작성자 · 최초 작성" 한 줄이 들어갑니다.</span>
        </div>
      </details>
    </div>

    <ol id="steps"></ol>

    <div class="tail">
      <button id="add-note" class="sm">메모 단계 추가</button>
    </div>
  </section>
</main>

<div id="toast" class="toast" hidden></div>

<template id="step-tpl">
  <li class="step card" data-id="">
    <div class="step-head">
      <span class="num"></span>
      <input class="s-title" aria-label="단계 제목">
      <div class="tools">
        <button class="sm ghost t-drag" title="끌어서 순서 바꾸기" aria-label="끌어서 순서 바꾸기">⠿</button>
        <button class="sm ghost t-up" title="위로">↑</button>
        <button class="sm ghost t-down" title="아래로">↓</button>
        <button class="sm ghost t-hl" title="하이라이트 표시 전환">하이라이트</button>
        <button class="sm ghost t-draw" title="화살표·박스·글자·번호·확대·가리기·자르기">그리기</button>
        <div class="menu step-menu">
          <button class="sm ghost t-more" title="더 보기" aria-label="더 보기">⋯</button>
          <div class="dropdown step-dropdown" hidden>
            <button data-act="note-below">아래에 메모 넣기</button>
            <button data-act="merge-up">위 단계와 합치기</button>
            <button data-act="split">단계 나누기 (같은 화면을 복사)</button>
            <button data-act="reset">문장 복원 (자동 생성 문장으로)</button>
          </div>
        </div>
        <button class="sm ghost t-del danger" title="이 단계 삭제 (되돌리기 가능)">삭제</button>
      </div>
    </div>
    <textarea class="s-desc" rows="2" aria-label="단계 설명"></textarea>
    <div class="draw-bar" hidden>
      <div class="draw-tools" role="toolbar" aria-label="그리기 도구"></div>
      <div class="draw-colors" role="group" aria-label="색"></div>
      <span class="spacer"></span>
      <button class="sm ghost d-del" title="고른 것 지우기 (Delete)" disabled>지우기</button>
      <button class="sm ghost d-uncrop" title="자른 것을 원래대로" disabled>자르기 해제</button>
      <button class="sm primary d-done">완료</button>
    </div>
    <div class="shot" hidden></div>
    <p class="s-meta faint"></p>
  </li>
</template>

<script type="module" src="editor.js"></script>
</body>
</html>
