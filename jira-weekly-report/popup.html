<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>주간보고 만들기</title>
  <link rel="stylesheet" href="ui.css" />
  <style>
    body { width: 520px; padding: 14px 16px 16px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    header img { width: 28px; height: 28px; }
    header h1 { font-size: 15px; margin: 0; line-height: 1.2; }
    header .sub { font-size: 11px; color: var(--muted); }
    .controls { display: flex; gap: 8px; align-items: stretch; }
    .controls label { display: flex; flex-direction: column; font-size: 11px; color: var(--muted); gap: 2px; }
    .controls input[type=date] { height: 34px; }
    #gen { flex: 1; height: 34px; align-self: flex-end; font-size: 14px; }
    #status { margin-top: 10px; min-height: 18px; font-size: 12px; color: var(--muted); }
    #meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    #notices { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    #out { margin-top: 10px; height: 320px; }
    .foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .foot .when { font-size: 11px; color: var(--muted); flex: 1; }
    #copy { min-width: 108px; }
    .empty {
      margin-top: 10px; padding: 28px 16px; text-align: center; color: var(--muted);
      border: 1px dashed var(--border); border-radius: var(--radius); background: var(--surface);
    }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" />
    <div class="grow">
      <h1>주간보고 만들기</h1>
      <div class="sub" id="target">Jira</div>
    </div>
    <button class="ghost" id="openOptions" title="설정">⚙ 설정</button>
  </header>

  <div class="controls">
    <label>기준일
      <input type="date" id="ref" />
    </label>
    <button class="primary" id="gen">이번 주 보고서 만들기</button>
  </div>

  <div id="status" class="row" aria-live="polite"></div>
  <div id="meta"></div>
  <div id="notices"></div>

  <div id="empty" class="empty">
    버튼을 누르면 Jira에서 이번 주 스프린트 작업과 진척률을 가져와<br />설정한 양식으로 정리합니다.
  </div>

  <div id="result" class="hidden">
    <textarea id="out" spellcheck="false" aria-label="주간보고 결과 (직접 수정 가능)"></textarea>
    <div class="foot">
      <span class="when" id="when"></span>
      <button id="viewJira" title="이번 보고서에 사용된 이슈를 Jira에서 보기">Jira에서 확인</button>
      <button class="primary" id="copy">복사하기</button>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
